<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Enhanced Android APK Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="msapplication-navbutton-color" content="#1a1a2e">
    
    <!-- Portrait orientation lock for Android -->
    <meta name="screen-orientation" content="portrait">
    <meta name="orientation" content="portrait">
    
    <!-- Prevent zoom and selection -->
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    
    <style>
      /* Enhanced Mobile Fullscreen CSS for Android APK */
      html, body {
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        margin: 0;
        padding: 0;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-text-size-adjust: 100%;
        
        /* Force portrait orientation */
        orientation: portrait;
        -webkit-transform: rotate(0deg);
        transform: rotate(0deg);
        
        /* Prevent system gestures */
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      
      #root {
        height: 100vh;
        width: 100vw;
        position: fixed;
        top: 0;
        left: 0;
        overflow: hidden;
        background: #1a1a2e;
      }
      
      /* Hide scrollbars */
      ::-webkit-scrollbar {
        display: none;
      }
      
      /* Prevent zoom and system gestures while preserving game touch */
      * {
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-tap-highlight-color: rgba(0,0,0,0);
        outline: none;
      }
      
      /* Allow game elements to be interactive */
      button, .clickable, .game-ui, [role="button"] {
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
        pointer-events: auto;
      }
      
      /* Prevent accidental back gesture on Android */
      body {
        overscroll-behavior-x: none;
        overscroll-behavior-y: none;
        -webkit-overflow-scrolling: touch;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="height: 100vh; display: flex; flex-direction: column; items-center; justify-content: center; background: #1a1a2e; color: #4ECDC4; font-family: sans-serif; text-align: center;">
        <h1 style="margin: 0; font-size: 24px; text-transform: uppercase; letter-spacing: 4px;">Loading Dan Corp OS...</h1>
        <p style="opacity: 0.5; font-size: 10px; margin-top: 10px;">[ INITIALIZING HUD & CORE ENGINE ]</p>
      </div>
    </div>

    <!-- Portrait Lock Overlay -->
    <div id="orientation-lock-overlay">
      <div class="icon">📱</div>
      <h2>Please Rotate Your Device</h2>
      <p>This game is designed to be played in portrait mode (vertical).</p>
    </div>

    <script>
      console.log("INLINE SCRIPT WORKS - Browser is executing JS");
    </script>
    <script type="module" src="/src/main.tsx"></script>
    
  </body>
</html>
